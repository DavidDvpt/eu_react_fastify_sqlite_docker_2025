services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api.prod
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/entropia-manager-api:${IMAGE_TAG:-latest}
    expose:
      - "8020"
    restart: unless-stopped
    networks:
      - ser5-network

  front:
    build:
      context: ..
      dockerfile: docker/Dockerfile.front.prod
      args:
        VITE_API_URL: ${VITE_API_URL?VITE_API_URL is required}
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/entropia-manager-front:${IMAGE_TAG:-latest}
    expose:
      - "8019"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - ser5-network

networks:
  ser5-network:
    external: true
