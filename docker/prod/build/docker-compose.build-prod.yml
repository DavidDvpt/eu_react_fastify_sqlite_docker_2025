services:
  front:
    build:
      context: ../../..
      dockerfile: docker/prod/build/Dockerfile.front.prod
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/entropia-manager-front:${IMAGE_TAG:-latest}
    expose:
      - "8019"
    restart: unless-stopped
    networks:
      - ser5-network

networks:
  ser5-network:
    external: true
