services:
  api:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/entropia-manager-api:${IMAGE_TAG:-latest}
    container_name: entropia-manager-api
    restart: unless-stopped
    environment:
      PORT: "8020"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://entropia-manager}
      SYSTEM_USER_ID: ${SYSTEM_USER_ID:?SYSTEM_USER_ID is required}
      SYSTEM_USER_PSEUDO: ${SYSTEM_USER_PSEUDO:?SYSTEM_USER_PSEUDO is required}
      SYSTEM_USER_EMAIL: ${SYSTEM_USER_EMAIL:?SYSTEM_USER_EMAIL is required}
      SYSTEM_USER_PASSWORD: ${SYSTEM_USER_PASSWORD:?SYSTEM_USER_PASSWORD is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-24h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SEED_INCLUDE_DEV_DATA: ${SEED_INCLUDE_DEV_DATA:-false}
      DEV_DATA_USER_ID: ${DEV_DATA_USER_ID:-}
      DEV_DATA_USER_PSEUDO: ${DEV_DATA_USER_PSEUDO:-}
      DEV_DATA_USER_EMAIL: ${DEV_DATA_USER_EMAIL:-}
      DEV_DATA_USER_PASSWORD: ${DEV_DATA_USER_PASSWORD:-}
    expose:
      - "8020"
    networks:
      - ser5-network

  front:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/entropia-manager-front:${IMAGE_TAG:-latest}
    container_name: entropia-manager-front
    restart: unless-stopped
    expose:
      - "8019"
    depends_on:
      - api
    networks:
      - ser5-network

networks:
  ser5-network:
    external: true
