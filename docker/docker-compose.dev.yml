services:
  db:
    image: postgres:16-alpine
    container_name: app_eu_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    ports:
      - "5433:5432"
    volumes:
      - app_eu_db_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  app_eu_db_dev_data:
