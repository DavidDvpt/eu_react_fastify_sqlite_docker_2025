events {}

http {
  server {
    listen 80;

    # Emplacement des fichiers statiques générés par Vite
    root /usr/share/nginx/html;
    index index.html;

    # Routing SPA React : redirige toutes les routes vers index.html
    location / {
      try_files $uri /index.html;
    }

    # Proxy pour l'API interne Docker
    # Le service s'appelle "api" dans docker-compose
    location /api/ {
      proxy_pass http://api:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
